apply plugin: 'com.android.application'

static def versionCodeDate() {
    return new Date().format("yyyy.MM.dd_HH.mm")
}

android {
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
    signingConfigs {
        release {
        }
    }
    compileSdkVersion 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk 21
        targetSdk 36

        versionCode 20
        versionName ""
    }
    buildTypes {
        debug {
            buildConfigField "Boolean", "DEBUG_MODE", "true"

            versionNameSuffix versionCodeDate()

            setProperty("archivesBaseName", "tOndO_keyboard_" + versionNameSuffix)

            dependencies {
                def acraVersion = '5.7.0'
                implementation "ch.acra:acra-mail:$acraVersion"
                implementation "ch.acra:acra-notification:$acraVersion"
            }
        }
        release {
            buildConfigField "Boolean", "DEBUG_MODE", "false"

            versionNameSuffix "1.0.7.2"

            setProperty("archivesBaseName", "tOndO_keyboard_" + versionNameSuffix)

            minifyEnabled false
            shrinkResources false

            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
            }
        }
    }
    namespace 'com.foschia.tondokeyboard'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    // Shared tOndO keyboard (Kotlin Multiplatform, see ../tondo) replacing the Unity library.
    implementation 'com.foschia.tondo:android:1.0.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'com.android.billingclient:billing:8.0.0'
    implementation 'com.google.guava:guava:33.5.0-android'

}

android.applicationVariants.all { variant ->
    variant.outputs.all {
        outputFileName = "tOndO_keyboard_${variant.versionName}-${variant.name}.apk"
    }
}
